# 파일 위치: .github/workflows/check.yml
# 역할: main으로 가는 PR을 열거나 새 커밋을 올릴 때마다 GitHub의 Windows PC에서 npm run check 실행
#   브랜치 이름과 상관없이 돌아요 (feature/, claude/, docs/ 모두)
#   CI = 코드를 올릴 때마다 자동으로 점검해 주는 기능. 결과는 PR 화면에 ✅/❌로 나와요.
#   수동 샘플(개인 사진)은 저장소에 없어서 해당 점검은 ⏭ 건너뛰어요.

name: 점검

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 외부 도구 설치 (exiftool, FFmpeg, ImageMagick)
        shell: pwsh
        run: |
          choco install exiftool ffmpeg imagemagick -y --no-progress
          # ImageMagick은 다음 단계부터 찾을 수 있게 위치를 직접 알려 줘요
          $dir = Get-ChildItem 'C:\Program Files\ImageMagick*' -Directory | Select-Object -First 1
          $dir.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Electron 받은 파일 보관: npm ci가 매번 github.com에서 Electron(약 100MB)을 받다가 504로 실패한 적이 있어요 (#52, #53)
      #   한 번 받은 파일은 캐시에서 꺼내 써요. package-lock.json이 바뀌면 새로 받아요
      - name: Electron 받은 파일 캐시
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 받기가 실패하면 20초 쉬고 한 번만 더 해요 (점검 자체는 다시 돌리지 않아요)
      - name: npm ci
        shell: pwsh
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host '패키지 받기 실패 → 20초 뒤 한 번 더'
            Start-Sleep -Seconds 20
            npm ci
          }
          exit $LASTEXITCODE

      - run: npm run check
