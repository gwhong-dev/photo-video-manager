# 파일 위치: .github/workflows/check.yml
# 역할: main으로 가는 PR을 열거나 새 커밋을 올릴 때마다 GitHub의 Windows PC에서 npm run check 실행
#   브랜치 이름과 상관없이 돌아요 (feature/, claude/, docs/ 모두)
#   CI = 코드를 올릴 때마다 자동으로 점검해 주는 기능. 결과는 PR 화면에 ✅/❌로 나와요.
#   수동 샘플(개인 사진)은 저장소에 없어서 해당 점검은 ⏭ 건너뛰어요.

name: 점검

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    # 외부 도구 버전 · 파일 지문(SHA256) (electron-cache.yml 과 같은 값이어야 PR 이 main 의 캐시를 꺼내 써요)
    env:
      EXIFTOOL_VERSION: '13.64'
      FFMPEG_VERSION: '9.1'
      EXIFTOOL_SHA256: '72C29C44D1E860EEBCAEFA71692D979AF9858FE9A6D7D791A5E7F1DAC77804AF'
      FFMPEG_SHA256: 'B9BBBB3ACECE000CBEEC994F856649354E52C773807841E78908374B24D658FD'
    # 부품은 Node 24 로 도는 v5 (v4 는 "Node 20 은 곧 지원 끝" 경고가 나와요)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # 외부 도구: Chocolatey 서버 고장(503)으로 점검이 통째로 실패해서 (2026-11-24 7번),
      #   공식 배포 파일을 버전을 정해 받고 캐시에 둬요. 자세한 건 .github/scripts/install-tools.ps1
      - name: 외부 도구 꺼내기
        id: tools-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/tools
          key: tools-${{ runner.os }}-exiftool-${{ env.EXIFTOOL_VERSION }}-ffmpeg-${{ env.FFMPEG_VERSION }}

      - name: 외부 도구 준비 (exiftool, FFmpeg, ImageMagick)
        id: tools
        shell: pwsh
        run: ./.github/scripts/install-tools.ps1 -ToolsDir "${{ runner.temp }}/tools" -ExiftoolVersion $env:EXIFTOOL_VERSION -FfmpegVersion $env:FFMPEG_VERSION -ExiftoolSha256 $env:EXIFTOOL_SHA256 -FfmpegSha256 $env:FFMPEG_SHA256

      - name: 외부 도구 저장
        if: steps.tools-cache.outputs.cache-hit != 'true' && steps.tools.outputs.complete == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      # Electron 받은 파일 꺼내기: npm ci가 매번 github.com에서 Electron(약 100MB)을 받다가 504로 실패한 적이 있어요 (#52, #53)
      #   PR에서 저장한 캐시는 그 PR에서만 보여요. 모든 PR이 같이 쓰는 캐시는 main에서 electron-cache.yml 이 채워요 (#54 검증)
      #   package-lock.json이 바뀌면 열쇠가 달라져서 새로 받아요
      - name: Electron 받은 파일 꺼내기
        id: electron-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 받기가 실패하면 20초 쉬고 한 번만 더 해요 (점검 자체는 다시 돌리지 않아요)
      - name: npm ci
        shell: pwsh
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host '패키지 받기 실패 → 20초 뒤 한 번 더'
            Start-Sleep -Seconds 20
            npm ci
          }
          exit $LASTEXITCODE

      # 새로 받았으면 npm ci 바로 뒤에 저장해요 (점검이 실패해도 다음 push 때 다시 받지 않게)
      - name: Electron 받은 파일 저장
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - run: npm run check
