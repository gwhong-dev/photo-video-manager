# 파일 위치: .github/workflows/auto-merge.yml
# 역할: `auto-merge` 라벨이 붙은 PR을, 점검(CI)이 통과하면 GitHub가 직접 main에 머지
#   - Claude는 S · M 등급 PR에만 라벨을 붙임 (CLAUDE.md 4-1)
#   - L 등급(원본 정리 · 파일 이동 · 삭제 · DB 구조 · 배포) 파일을 건드린 PR은 라벨이 있어도 머지하지 않음
#   - 점검이 끝난 바로 그 커밋(sha)만 머지. 그 뒤에 새 커밋이 올라오면 다시 점검을 기다림
# 언제 돌까: ① 점검이 끝났을 때 ② PR에 라벨을 붙였을 때 (점검이 이미 통과한 경우)

name: 자동 머지

on:
  workflow_run:
    workflows: ["점검"]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const LABEL = 'auto-merge';

            // L 등급 파일: 여기를 바꾼 PR은 사용자가 직접 머지
            const L_FILES = [
              'lib/cleaner.js', 'lib/processor.js', 'lib/planner.js',
              'lib/job.js', 'lib/db.js', 'package.json', 'package-lock.json',
            ];
            const L_DIRS = ['.github/workflows/'];

            // 1. 어떤 PR을 볼지 정하기
            let numbers = [];
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return core.info('점검 실패 → 머지 안 함');
              numbers = (run.pull_requests || []).map(p => p.number);
            } else {
              if (context.payload.label?.name !== LABEL) return core.info('다른 라벨 → 할 일 없음');
              numbers = [context.payload.pull_request.number];
            }

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });

              // 2. 기본 조건: 열려 있음, main으로 감, 초안 아님, 라벨 있음
              if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.draft) { core.info(`#${number} 대상 아님`); continue; }
              if (!pr.labels.some(l => l.name === LABEL)) { core.info(`#${number} 라벨 없음`); continue; }

              // 3. L 등급 파일을 건드렸으면 멈춤
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number });
              const lHit = files.map(f => f.filename)
                .filter(n => L_FILES.includes(n) || L_DIRS.some(d => n.startsWith(d)));
              if (lHit.length) { core.warning(`#${number} L 등급 파일 → 사용자가 머지: ${lHit.join(', ')}`); continue; }

              // 4. 지금 마지막 커밋의 점검(check)이 통과했는지 확인
              const sha = pr.head.sha;
              const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: sha, check_name: 'check' });
              const ok = checks.check_runs.some(c => c.status === 'completed' && c.conclusion === 'success');
              if (!ok) { core.info(`#${number} 점검 통과 전 → 기다림`); continue; }

              // 5. 점검한 그 커밋만 머지 (sha가 바뀌었으면 GitHub가 거절)
              await github.rest.pulls.merge({ owner, repo, pull_number: number, sha, merge_method: 'merge' });
              core.info(`#${number} 머지 완료 (${sha.slice(0, 7)})`);
            }
