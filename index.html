<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>사진/영상 관리 프로그램</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --line: #e3e6eb;
      --text: #1f2328;
      --sub: #667085;
      --blue: #2d7ff9;
      --green: #1a9e5a;
      --orange: #d77a00;
      --red: #d33a3a;
      --purple: #7a4fd6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 28px 40px;
      font-size: 14px;
    }
    h1 { font-size: 22px; margin: 0 0 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 12px;
    }
    .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
    .label { width: 110px; font-weight: bold; }
    .path { color: var(--sub); word-break: break-all; }
    button {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #f0f3f7; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.primary:hover:not(:disabled) { background: #1f6ee6; }
    button.danger { color: var(--red); }
    button.small { padding: 3px 10px; font-size: 12px; }
    input[type="number"] { width: 80px; padding: 5px; font-family: inherit; }

    /* 도구 상태 */
    .tool { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 14px; background: #eef6f0; }
    .tool.bad { background: #fdeeee; color: var(--red); }

    /* 이어하기 배너 */
    #banner { display: none; border-color: #c9dafc; background: #f2f6ff; }
    #banner b { font-size: 15px; }

    /* 요약 칩 */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { background: #f0f2f5; border-radius: 12px; padding: 4px 12px; }
    .chip.orange { background: #fff3e0; color: var(--orange); }
    .chip.red { background: #fdeeee; color: var(--red); }
    .chip.purple { background: #f3eefe; color: var(--purple); }
    .chip.green { background: #eaf7ef; color: var(--green); }

    /* 진행률 */
    #progressBox { display: none; margin-top: 10px; }
    progress { width: 100%; height: 20px; }
    #progressText { margin-top: 4px; color: var(--sub); }
    #status { margin-top: 8px; font-size: 15px; white-space: pre-line; }

    /* 표 */
    .tableHead { display: flex; align-items: center; gap: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #f5f6f8; position: sticky; top: 0; }
    td.name { word-break: break-all; }
    td.nowrap { white-space: nowrap; }
    .s-done { color: var(--green); }
    .s-dup { color: var(--sub); }
    .s-fail, .s-broken { color: var(--red); font-weight: bold; }
    .s-skip { color: var(--sub); }
    .tag { display: inline-block; font-size: 11px; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
    .t-new { background: #e7f0ff; color: var(--blue); }
    .t-num { background: #fff3e0; color: var(--orange); }
    .t-nodate { background: #f3eefe; color: var(--purple); }
    .t-check { background: #fdeeee; color: var(--red); }
    .muted { color: var(--sub); }
    .warnline { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #fff4d6; color: #7a5300; font-size: 13px; line-height: 1.5; }

    /* 원본 정리 확인 창 + 🔍 샘플 확인 (CLAUDE.md "화면 디자인" 색과 글꼴) */
    #cleanDialog {
      width: min(640px, 92vw);
      max-height: 88vh;
      padding: 0;
      border: 1px solid #55534E;
      border-radius: 10px;
      background: #403F3B;
      color: #F1EEE6;
      font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
    }
    #cleanDialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    #cleanDialog button { font-family: inherit; background: #403F3B; color: #F1EEE6; border-color: #55534E; }
    #cleanDialog button:hover:not(:disabled) { background: #4A4944; }
    #cleanDialog button.cd-go { background: #F1EEE6; color: #33322F; border-color: #F1EEE6; font-weight: 600; }
    #cleanDialog button.cd-go:hover:not(:disabled) { background: #E2DED4; }
    .cd-body { padding: 18px 22px; overflow-y: auto; max-height: calc(88vh - 64px); }
    .cd-title { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
    .cd-msg { white-space: pre-line; line-height: 1.55; }
    .cd-sample-head { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid #55534E; }
    .cd-sub { color: #B3AFA5; font-size: 12px; margin-top: 4px; }
    .cd-list { list-style: none; margin: 8px 0 0; padding: 0; }
    #cleanDialog .cd-list button { width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: left; border: 0; border-bottom: 1px solid #55534E; border-radius: 0; padding: 7px 4px; background: transparent; }
    #cleanDialog .cd-list button:hover:not(:disabled) { background: #4A4944; }
    .cd-kind { flex: none; width: 72px; color: #B3AFA5; }
    .cd-name { flex: 1; word-break: break-all; }
    .cd-folder { flex: none; color: #8C887E; font-size: 12px; }
    .cd-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid #55534E; background: #33322F; border-radius: 0 0 10px 10px; }
  </style>
</head>
<body>
  <div class="row" style="justify-content:space-between;margin:0 0 14px">
    <h1 style="margin:0">📸 사진/영상 관리 프로그램</h1>
    <button id="galleryBtn">갤러리 화면 열기</button>
  </div>

  <!-- 1. 도구 상태 -->
  <div class="card">
    <div class="row">
      <span class="label">🧰 도구</span>
      <span id="tools" class="row" style="margin:0"></span>
      <button class="small" id="recheckBtn">다시 확인</button>
    </div>
  </div>

  <!-- 2. 이어하기 배너 (남은 작업이 있을 때만 보여요) -->
  <div class="card" id="banner">
    <div><b>📌 진행 중인 작업이 있어요</b> <span class="muted" id="bannerFrom"></span></div>
    <div class="chips" id="bannerChips"></div>
    <div id="folderNote" class="warnline" style="display:none"></div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="nextBtn">▶ 이어서 실행</button>
      <button id="retryBtn" style="display:none">🔁 실패한 0개 다시 시도</button>
      <button id="trashBtn">🧹 원본 정리</button>
      <button id="finishBtn">✔ 작업 끝내기</button>
      <button class="danger" id="cancelBtn">✖ 작업 취소</button>
    </div>
  </div>

  <!-- 3. 폴더 & 옵션 -->
  <div class="card">
    <div class="row">
      <span class="label">📥 가져올 폴더</span>
      <button id="srcBtn">폴더 선택</button>
      <span class="path" id="srcPath">선택 안 함</span>
    </div>
    <div class="row">
      <span class="label">💾 백업 폴더</span>
      <button id="destBtn">폴더 선택</button>
      <span class="path" id="destPath">선택 안 함</span>
    </div>
    <div class="row">
      <span class="label">⚙ 옵션</span>
      <label><input type="checkbox" id="includeSub"> 하위 폴더 포함</label>
      <span class="muted">|</span>
      <label>한 번에 <input type="number" id="batchSize" min="1" step="100"> 개씩 처리</label>
    </div>
    <div class="row muted" style="font-size:12px">
      결과: 백업폴더\년\월\일\2025-03-28_200653_원본이름.jpg · 날짜 모르는 파일은 _날짜없음 · 원본은 끝난 뒤 물어보고 정리 (휴지통 또는 _정리완료원본)
    </div>
  </div>

  <!-- 4. 버튼 & 진행률 -->
  <div class="card">
    <div class="row">
      <button id="previewBtn">👀 미리보기</button>
      <button class="primary" id="runBtn" disabled>✅ 실행</button>
      <button id="pauseBtn" disabled>⏸ 일시정지</button>
      <span class="muted">|</span>
      <button id="logBtn">📝 로그 폴더</button>
      <button id="openBtn">📂 백업 폴더 열기</button>
    </div>
    <div id="progressBox">
      <progress id="bar" value="0" max="100"></progress>
      <div id="progressText"></div>
    </div>
    <div id="status" class="muted">가져올 폴더와 백업 폴더를 고르고 미리보기를 눌러 주세요.</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- 5. 표 -->
  <div class="card">
    <div class="tableHead">
      <b>📋 목록</b>
      <select id="filter">
        <option value="all">전체 (주의할 것 먼저)</option>
        <option value="issue">⚠ 주의할 것만</option>
        <option value="todo">예정</option>
        <option value="nodate">📁 날짜없음</option>
        <option value="dup">⏭ 중복</option>
        <option value="fail">❌ 실패</option>
      </select>
      <span class="muted" id="tableInfo"></span>
    </div>
    <table id="table"></table>
  </div>

  <!-- 6. 원본 정리 확인 창 (🔍 샘플 확인: 결과 파일 무작위 10개, 누르면 크게 열림, 다시 뽑기) -->
  <dialog id="cleanDialog">
    <div class="cd-body">
      <div class="cd-title">🧹 원본 정리</div>
      <div class="cd-msg" id="cdMsg"></div>
      <div class="cd-sample-head">
        <b>🔍 샘플 확인</b>
        <button class="small" id="cdResample">다른 10개 뽑기</button>
      </div>
      <div class="cd-sub" id="cdSampleInfo"></div>
      <ul class="cd-list" id="cdSample"></ul>
      <div class="cd-sub" id="cdSampleErr"></div>
    </div>
    <div class="cd-foot">
      <button id="cdLater">나중에 정리하기</button>
      <!-- 휴지통에 다 담기지 않을 때만 보여요: 그래도 휴지통으로 (먼저 넣은 것부터 비워져 사실상 되살릴 수 없음) -->
      <button id="cdGoBin" hidden>휴지통으로 옮기기</button>
      <button class="cd-go" id="cdGo">원본 정리하기</button>
    </div>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    // api = preload.js에서 열어 준 기능들 (window.api 와 같아요)

    const state = { source: '', backupRoot: '', includeSub: true, batchSize: 2000 };
    let job = null;         // 진행 중인 작업 정보
    let planReady = false;  // 미리보기 끝났는지
    let cleanOnly = false;  // 새로 처리할 파일은 없고 원본 정리만 남았는지 (전부 중복)
    let busy = false;       // 뭔가 하는 중인지
    let pauseClicked = false; // 이번 실행에서 일시정지를 눌렀는지 (끝난 뒤 원본 확인을 자동으로 할지 정할 때)

    // ---------- 도우미 ----------
    const num = (n) => Number(n || 0).toLocaleString('ko-KR');
    function fmtTime(sec) {
      sec = Math.max(0, Math.round(sec));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return [h, m, s].map((v) => String(v).padStart(2, '0')).join(':');
    }
    function fmtBytes(b) {
      if (b >= 1024 ** 3) return (b / 1024 ** 3).toFixed(1) + 'GB';
      if (b >= 1024 ** 2) return (b / 1024 ** 2).toFixed(1) + 'MB';
      return Math.round(b / 1024) + 'KB';
    }
    function chip(text, cls = '') {
      const s = document.createElement('span');
      s.className = 'chip ' + cls;
      s.textContent = text;
      return s;
    }
    function setStatus(text) { $('status').textContent = text; }
    const batchSize = () => Math.max(1, Number($('batchSize').value) || 2000);

    // 버튼 켜고 끄기
    function setBusy(on, isRunning = false) {
      busy = on;
      ['previewBtn', 'srcBtn', 'destBtn', 'nextBtn', 'trashBtn', 'finishBtn', 'cancelBtn', 'includeSub', 'batchSize', 'recheckBtn', 'retryBtn']
        .forEach((id) => ($(id).disabled = on));
      document.querySelectorAll('#tools button').forEach((b) => (b.disabled = on)); // "위치 지정"도 작업 중에는 막아요 (쓰던 exiftool을 닫으면 안 돼서)
      $('runBtn').disabled = on || !planReady;
      $('pauseBtn').disabled = !isRunning;
      $('pauseBtn').textContent = '⏸ 일시정지';
      $('progressBox').style.display = isRunning ? 'block' : 'none';
    }

    // ---------- 도구 상태 ----------
    const TOOL_NAMES = { exiftool: 'exiftool', magick: 'ImageMagick', ffmpeg: 'FFmpeg' };
    function renderTools(t) {
      const box = $('tools');
      box.innerHTML = '';
      for (const key of Object.keys(TOOL_NAMES)) {
        const ok = t[key] && t[key].ok;
        const span = document.createElement('span');
        span.className = 'tool' + (ok ? '' : ' bad');
        span.title = ok ? `${t[key].path}\n${t[key].version}` : '찾지 못했어요';
        span.textContent = (ok ? '✅ ' : '❌ ') + TOOL_NAMES[key];
        if (!ok) {
          const b = document.createElement('button');
          b.className = 'small';
          b.textContent = '위치 지정';
          b.disabled = busy;
          b.onclick = async () => {
            try {
              renderTools(await api.pickTool(key));
            } catch (e) {
              setStatus('⚠ ' + cleanErr(e));
            }
          };
          span.appendChild(b);
        }
        box.appendChild(span);
      }
    }
    $('recheckBtn').onclick = async () => {
      try {
        renderTools(await api.checkTools());
      } catch (e) {
        setStatus('⚠ ' + cleanErr(e)); // 작업 중이라 거절됐을 때도 이유를 보여줘요
      }
    };

    // ---------- 이어하기 배너 ----------
    function setJob(info) {
      job = info;
      renderFolderNote();
      if (!info) {
        $('banner').style.display = 'none';
        return;
      }
      const s = info.stats;
      renderJobChips(s, 'run'); // 작업이 열려 있으면 아래 칩도 미리보기 숫자 대신 결과로
      $('banner').style.display = 'block';
      $('bannerFrom').textContent = `· ${info.source} → ${info.backupRoot}`;
      const c = $('bannerChips');
      c.innerHTML = '';
      c.appendChild(chip(`전체 ${num(s.total)}`));
      c.appendChild(chip(`✅ 완료 ${num(s.done)}`, 'green'));
      if (s.dup) c.appendChild(chip(`⏭ 중복 ${num(s.dup)}`));
      if (s.fail) c.appendChild(chip(`❌ 실패 ${num(s.fail)}`, 'red'));
      if (s.broken) c.appendChild(chip(`⚠ 재생 불가 ${num(s.broken)}`, 'red'));
      c.appendChild(chip(`⏳ 남은 작업 ${num(s.todo)}`, s.todo ? 'orange' : ''));
      if (info.deletable) c.appendChild(chip(`🗑 지울 수 있는 원본 ${num(info.deletable)}개 (${fmtBytes(info.deletableBytes)})`, 'purple'));
      else if (info.deletable == null) c.appendChild(chip('🗑 지울 수 있는 원본 세는 중')); // 처음 켤 때 · 다시 시도 직후 (다 세면 바뀌어요)

      $('nextBtn').style.display = s.todo ? '' : 'none';
      $('nextBtn').textContent = `▶ 다음 ${num(Math.min(batchSize(), s.todo))}개 실행`;
      $('retryBtn').style.display = s.fail ? '' : 'none';
      $('retryBtn').textContent = `🔁 실패한 ${num(s.fail)}개 다시 시도`;
      $('trashBtn').style.display = info.deletable !== 0 ? '' : 'none'; // 세는 중(null)이어도 누를 수 있어요 (누르면 처음부터 확인해요)
      $('finishBtn').style.display = s.todo ? 'none' : '';
      $('cancelBtn').style.display = s.todo ? '' : 'none';
    }

    // ---------- 요약 칩 (미리보기 결과) ----------
    function renderStats(s) {
      const c = $('chips');
      c.innerHTML = '';
      c.appendChild(chip(`처리 예정 ${num(s.todo)}개 (HEIC→JPG ${num(s.heic)} · MOV→MP4 ${num(s.mov)} · 이름만 ${num(s.copy)})`, 'green'));
      if (s.newFolders) c.appendChild(chip(`🆕 새 폴더 ${num(s.newFolders)}개`));
      if (s.noDate) c.appendChild(chip(`📁 날짜없음 ${num(s.noDate)}`, 'purple'));
      if (s.dup) c.appendChild(chip(`⏭ 중복 ${num(s.dup)}` + (s.check ? ` (확인 필요 ${num(s.check)})` : ''), s.check ? 'red' : ''));
      if (s.renamed) c.appendChild(chip(`🔁 _번호 붙음 ${num(s.renamed)}`, 'orange'));
      if (s.skip) c.appendChild(chip(`✔ 이미 정리됨 ${num(s.skip)}`));
      if (s.unsure) c.appendChild(chip(`⚠ 확인 필요 (이미 있는 파일과 같은지 모름) ${num(s.unsure)}`, 'red'));
      c.appendChild(chip(`날짜 출처: 촬영정보 ${num(s.byFrom['촬영정보'])} · 파일이름 ${num(s.byFrom['파일이름'])} · 앨범정보 ${num(s.byFrom['앨범정보'])} · 없음 ${num(s.byFrom['없음'])}`));
    }

    // ---------- 요약 칩 (실행한 뒤 결과) ----------
    // 실행을 시작하면 미리보기 숫자("처리 예정 …") 대신 작업 결과를 보여 줘요
    //   2026-11-18 실사용: 다 끝났는데 칩이 "처리 예정 218개" 그대로라 다 된 건지 알 수 없었음
    //   s: 작업 숫자(main.js infoOf: 완료 · 중복 · 실패 · 재생 불가 · 남은 것 · 휴지통 trashed · 옮김 moved)
    //   작업이 열려 있는 동안 위쪽 배너와 숫자가 겹치지만, 작업을 닫으면 배너가 사라져서 여기 결과가 남아요
    //   phase: 'run' 작업이 열려 있음 / 'done' 모든 작업 끝 / 'finish' "작업 끝내기"로 끝냄 / 'cancel' 취소함
    //   돌려주는 값: [글자, 색] 목록 (화면 그리기와 나눠서 점검이 그대로 불러 써요)
    function resultChips(s, phase) {
      const n = (v) => Number(v || 0).toLocaleString('ko-KR');
      const out = [];
      if (phase === 'done') out.push(['🎉 모든 작업 끝', 'green']);
      else if (phase === 'finish') out.push(['작업 끝냄', '']);
      else if (phase === 'cancel') out.push(['작업 취소함', '']);
      else if (s.todo) out.push(['지금까지 결과', '']);
      else if (!s.done && !s.fail && !s.broken) out.push(['새로 처리할 파일 없음', '']); // 전부 중복이라 원본 정리만 하는 작업
      else out.push(['실행 끝', 'green']);
      if (s.done || s.todo || s.fail || s.broken) out.push([`✅ 완료 ${n(s.done)}`, 'green']);
      if (s.dup) out.push([`⏭ 중복 ${n(s.dup)}`, '']);
      if (s.skip) out.push([`✔ 이미 정리됨 ${n(s.skip)}`, '']);
      if (s.fail) out.push([`❌ 실패 ${n(s.fail)}`, 'red']);
      if (s.broken) out.push([`⚠ 재생 불가 ${n(s.broken)}`, 'red']);
      if (s.todo) out.push(phase === 'cancel' ? [`✖ 하지 않음 ${n(s.todo)}`, ''] : [`⏳ 남은 ${n(s.todo)}`, 'orange']);
      // 원본 정리 = 휴지통으로 보낸 것(trashed) + _정리완료원본으로 옮긴 것(moved, USB · SD · 휴지통이 모자란 드라이브)
      const cleaned = (s.trashed || 0) + (s.moved || 0);
      if (cleaned) out.push([`🧹 원본 정리 ${n(cleaned)}` + (s.moved ? (s.trashed ? ` (휴지통 ${n(s.trashed)}, _정리완료원본 ${n(s.moved)})` : ' (_정리완료원본으로)') : ''), 'purple']);
      return out;
    }
    function renderJobChips(s, phase) {
      const c = $('chips');
      c.innerHTML = '';
      for (const [text, cls] of resultChips(s, phase)) c.appendChild(chip(text, cls));
    }

    // ---------- 표 ----------
    function renderTable(res) {
      const t = $('table');
      t.innerHTML = '<tr><th>상태</th><th>원본</th><th>작업</th><th>새 이름</th><th>갈 위치</th><th>날짜 출처</th><th>메모</th></tr>';
      for (const r of res.rows) {
        const tr = document.createElement('tr');
        const cells = [r.status, r.src, r.work, r.name, r.dir, r.dateFrom, r.note];
        cells.forEach((text, i) => {
          const td = document.createElement('td');
          td.textContent = text;
          if (i === 0) td.className = 'nowrap s-' + r.statusKey;
          if (i === 2 || i === 5) td.className = 'nowrap';
          if (i === 1 || i === 3) td.className = 'name';
          if (i === 3 && r.renamed) td.appendChild(tag('_번호', 't-num'));
          if (i === 4 && r.newFolder) td.appendChild(tag('🆕 새 폴더', 't-new'));
          if (i === 4 && r.noDate) td.appendChild(tag('날짜없음', 't-nodate'));
          if (i === 6 && r.check) td.appendChild(tag('확인 필요', 't-check'));
          tr.appendChild(td);
        });
        t.appendChild(tr);
      }
      $('tableInfo').textContent = res.total > res.rows.length
        ? `총 ${num(res.total)}개 중 ${num(res.rows.length)}개만 표시`
        : `총 ${num(res.total)}개`;
    }
    function tag(text, cls) {
      const s = document.createElement('span');
      s.className = 'tag ' + cls;
      s.textContent = text;
      return s;
    }
    $('filter').onchange = async () => renderTable(await api.getRows($('filter').value));

    // ---------- 폴더 & 옵션 ----------
    function renderPaths() {
      $('srcPath').textContent = state.source || '선택 안 함';
      $('destPath').textContent = state.backupRoot || '선택 안 함';
      renderFolderNote();
    }
    // 진행 중인 작업의 폴더와 지금 고른 폴더가 다르면 알려 줘요
    //   "다음 실행"은 진행 중 작업(옛 폴더)을 이어서 하고, 새 폴더는 미리보기를 다시 해야 적용돼요 (2026-11-14 실사용: SSD 로 바꾼 줄 알고 20분 돌림)
    function renderFolderNote() {
      const el = $('folderNote');
      if (!el) return;
      const same = (a, b) => String(a || '').replace(/[\\/]+$/, '').toLowerCase() === String(b || '').replace(/[\\/]+$/, '').toLowerCase();
      const diffSrc = job && state.source && !same(job.source, state.source);
      const diffDest = job && state.backupRoot && !same(job.backupRoot, state.backupRoot);
      if (!diffSrc && !diffDest) {
        el.style.display = 'none';
        return;
      }
      // 남은 작업이 없으면(원본 정리만 남음) "다음 실행" 버튼이 없고, 미리보기를 누르면 작업이 "취소"가 아니라 "끝나요"
      el.textContent = job.stats && job.stats.todo
        ? `⚠ 고른 폴더가 진행 중인 작업과 달라요. "다음 실행"은 진행 중인 작업(${job.source} → ${job.backupRoot})을 이어서 해요. 새로 고른 폴더로 하려면 "미리보기"를 다시 눌러 주세요 (진행 중인 작업은 취소돼요)`
        : `⚠ 고른 폴더가 진행 중인 작업(원본 정리만 남음, ${job.source} → ${job.backupRoot})과 달라요. "원본 정리"는 진행 중인 작업의 원본을 정리해요. 새로 고른 폴더로 하려면 "미리보기"를 다시 눌러 주세요 (진행 중인 작업은 끝나요)`;
      el.style.display = 'block';
    }
    function resetPlan() {
      planReady = false;
      cleanOnly = false;
      $('runBtn').disabled = true;
      $('runBtn').textContent = '✅ 실행'; // 원본 정리만 할 때 바꾼 글자를 되돌려요
    }
    // 고르는 순간 폴더 조합 확인 → 안 되면 이유를 보여주고 고른 것을 취소
    async function folderRejected(source, backupRoot) {
      const v = await api.checkFolders(source, backupRoot);
      if (v.ok) return false;
      setStatus('⛔ ' + v.reason);
      alert('⛔ ' + v.reason);
      return true;
    }
    $('srcBtn').onclick = async () => {
      const f = await api.selectFolder('가져올 폴더 선택', state.source);
      if (!f) return;
      if (await folderRejected(f, state.backupRoot)) return;
      state.source = f;
      renderPaths();
      resetPlan();
      api.saveSettings({ source: f });
    };
    $('destBtn').onclick = async () => {
      const f = await api.selectFolder('백업 폴더 선택 (예: G:\\_홍경우사진백업정리)', state.backupRoot);
      if (!f) return;
      if (await folderRejected(state.source, f)) return;
      state.backupRoot = f;
      renderPaths();
      resetPlan();
      api.saveSettings({ backupRoot: f });
    };
    $('includeSub').onchange = () => {
      resetPlan();
      api.saveSettings({ includeSub: $('includeSub').checked });
    };
    $('batchSize').onchange = () => {
      api.saveSettings({ batchSize: batchSize() });
      if (job) setJob(job);
    };

    // ---------- 미리보기 ----------
    api.onPlanStatus((msg) => setStatus(msg));
    // 처음 켤 때 정리할 원본 개수를 다 세면 배너를 다시 그려요 (다른 일을 하는 중이면 그쪽 결과가 다시 그려요)
    api.onJobInfo((info) => {
      if (!busy && job) setJob(info);
    });

    $('previewBtn').onclick = async () => {
      if (!state.source || !state.backupRoot) {
        alert('가져올 폴더와 백업 폴더를 먼저 골라 주세요!');
        return;
      }
      // 진행 중인 작업이 있으면 확인
      if (job) {
        const msg = job.stats.todo
          ? `진행 중인 작업이 있어요 (남은 ${num(job.stats.todo)}개).\n\n새로 미리보기를 하면 이전 작업은 취소돼요.\n(이미 완료된 파일은 그대로 있어요)\n\n계속할까요?`
          : `원본 정리가 남은 작업이 있어요.\n\n새로 미리보기를 하면 이전 작업은 끝내요. 계속할까요?`;
        if (!confirm(msg)) return;
        await api.closeJob(job.stats.todo ? 'cancel' : 'done');
        setJob(null);
      }

      resetPlan();
      setBusy(true);
      $('chips').innerHTML = '';
      $('table').innerHTML = '';
      setStatus('⏳ 계획 만드는 중... (파일이 많으면 몇 분 걸려요)');
      try {
        const res = await api.makePlan({ source: state.source, backupRoot: state.backupRoot, includeSub: $('includeSub').checked });
        renderStats(res.stats);
        $('filter').value = 'all';
        renderTable(res);
        if (res.stats.todo === 0 && res.cleanable) {
          // 전부 중복이어도 백업에 이미 있는 원본은 정리할 수 있어요 → 실행을 누르면 원본 정리만 물어봐요
          planReady = true;
          cleanOnly = true;
          // 버튼 글자는 누르면 생기는 일을 말해요 (CLAUDE.md 화면 디자인)
          $('runBtn').textContent = `🧹 원본 ${num(res.cleanable)}개 정리하기`;
          setStatus(`✅ 새로 처리할 파일이 없어요 (전부 중복이에요)\n🧹 백업 폴더에 이미 있는 원본 ${num(res.cleanable)}개는 정리할 수 있어요. 아래 "원본 ${num(res.cleanable)}개 정리하기"를 누르면 하나씩 확인한 뒤 물어볼게요`);
        } else if (res.stats.todo === 0) {
          setStatus('✅ 새로 처리할 파일이 없어요' + (res.stats.dup ? ' (전부 중복이에요)' : ''));
        } else {
          planReady = true;
          setStatus(`👀 미리보기 완료! 아직 아무것도 안 바꿨어요.\n처리 예정 ${num(res.stats.todo)}개 → 실행을 누르면 ${num(Math.min(batchSize(), res.stats.todo))}개부터 처리해요.`);
        }
      } catch (e) {
        setStatus('❌ ' + e.message.replace(/^Error invoking remote method '[^']+': (Error: )?/, ''));
      } finally {
        setBusy(false);
      }
    };

    // ---------- 실행 ----------
    $('runBtn').onclick = async () => {
      if (!planReady) return;
      if (cleanOnly) {
        const ok = confirm(
          `새로 만들 파일은 없어요.\n\n` +
          `· 백업 폴더에 이미 있는 원본을 정리할지 다음 창에서 물어볼게요\n` +
          `· 정리하기 전에 백업 쪽 파일이 멀쩡한지 다시 확인해요\n` +
          `· 영구 삭제는 하지 않아요`
        );
        if (!ok) return;
        resetPlan(); // 작업을 만드는 동안 한 번 더 눌러도 두 번 가지 않게 버튼부터 꺼요 (글자도 되돌려요)
        try {
          setJob(await api.startJob());
          await askTrash();
          await maybeFinish();
        } catch (e) {
          setStatus('❌ ' + cleanErr(e));
        } finally {
          setBusy(false);
        }
        return;
      }
      const n = batchSize();
      const ok = confirm(
        `미리보기대로 실행할까요?\n\n` +
        `· 이번에 최대 ${num(n)}개 처리 (남은 건 다음에 이어서)\n` +
        `· 원본은 그대로 두고, 백업 폴더에 새로 만들어요\n` +
        `· 끝나면 원본 정리 확인을 할지 물어볼게요\n` +
        `· 기록은 로그 파일로 남아요\n` +
        `· 실행하는 동안 가져올 폴더 · 백업 폴더의 탐색기 창과 속성 창은 닫아 두세요 (탐색기 메모리가 커져 PC 가 멈출 수 있어요)`
      );
      if (!ok) return;
      try {
        setJob(await api.startJob());
        planReady = false;
        await runBatch();
      } catch (e) {
        setStatus('❌ ' + cleanErr(e));
      }
    };
    $('nextBtn').onclick = () => runBatch();
    // 실패한 파일만 대기로 되돌린 뒤 그 개수만큼만 처리하고 멈춰요 (원본은 그대로, 임시 파일만 정리)
    //   2026-11-15 실사용: 16개를 다시 시도했는데 "한 번에 5,000개" 묶음이 통째로 돌았음
    //   실행은 목록 순서대로 대기 파일을 골라서, 앞쪽에 있던 실패 파일이 먼저 처리돼요
    $('retryBtn').onclick = async () => {
      const n = job ? job.stats.fail : 0;
      if (!n || !confirm(`실패한 ${num(n)}개만 다시 처리할까요?\n\n· 끝나면 멈춰요 (남은 작업은 "다음 실행"으로)\n· 원본은 그대로 두고, 백업 폴더에 새로 만들어요\n· 지난번에 쓰다 만 임시 파일(.__tmp__)만 지워요`)) return;
      try {
        const r = await api.retryFailed();
        setJob(r.job);
        await runBatch(r.requeued);
      } catch (e) {
        setStatus('❌ ' + cleanErr(e));
      }
    };

    api.onProgress((p) => {
      // p.done 은 "완료된 수"만이에요. 처리한 수는 완료 + 중복 + 실패 + 재생 불가
      const handled = p.done + p.dup + p.fail + p.broken;
      $('bar').max = p.total;
      $('bar').value = handled;
      const pct = Math.floor((handled / p.total) * 100);
      $('progressText').textContent =
        `${pct}%  |  ${num(handled)} / ${num(p.total)}  |  완료 ${num(p.done)} · 중복 ${num(p.dup)} · 실패 ${num(p.fail)} · 재생 불가 ${num(p.broken)}  |  ` +
        (p.bytesTotal ? `${fmtBytes(p.bytesDone)} / ${fmtBytes(p.bytesTotal)}  |  ${fmtBytes(p.bytesPerSec)}/s  |  ` : '') +
        `경과 ${fmtTime(p.elapsedSec)}  |  남은 시간 ${fmtTime(p.remainSec)}${p.remainBy === 'bytes' ? ' (크기 기준)' : ''}  |  ${p.name}`;
    });

    // n: 이번에 처리할 개수 (안 주면 "한 번에 N개" 칸 값)
    async function runBatch(n = batchSize()) {
      // 남은 공간 먼저 확인 (모자라면 시작 안 함, 80% 넘으면 한 번 더 물어봄)
      const space = await api.spaceInfo(n);
      if (space && !space.ok) {
        setStatus('⛔ ' + space.warning + '\n백업 드라이브 공간을 비우거나 한 번에 처리할 개수를 줄여 주세요.');
        return;
      }
      if (space && space.warning && !confirm(`⚠️ ${space.warning}\n\n그래도 실행할까요?`)) return;

      setBusy(true, true);
      pauseClicked = false;
      $('bar').value = 0;
      $('progressText').textContent = '⏳ 시작합니다...';
      setStatus('⏳ 처리 중... (일시정지를 누르면 지금 파일까지만 하고 멈춰요)');
      try {
        const r = await api.runBatch(n);
        setJob(r.job);
        // PC 메모리가 위험해서 멈췄으면 원본 정리도 하지 않고 안내만 해요 (lib/memory-guard.js)
        if (r.memoryLow) {
          setStatus('⚠ ' + r.memoryLow + (r.handled ? `
이번에 처리한 것: 완료 ${num(r.done)} · 중복 ${num(r.dup)} · 실패 ${num(r.fail)}` : ''));
          renderTable(await api.getRows($('filter').value));
          return;
        }
        if (r.stopped) {
          setStatus('⛔ ' + r.stopped);
          return;
        }
        const left = r.job ? r.job.stats.todo : 0;
        setStatus(
          `${r.paused ? '⏸ 일시정지했어요' : '🎉 이번 회차 끝!'}  완료 ${num(r.done)} · 중복 ${num(r.dup)} · 실패 ${num(r.fail)}` +
          (r.broken ? ` · 재생 불가 ${num(r.broken)}` : '') +
          (left ? `\n⏳ 남은 작업 ${num(left)}개 → 위쪽 "다음 실행" 버튼으로 이어서 할 수 있어요 (프로그램을 꺼도 돼요)` : '') +
          (r.fail ? `\n❌ 실패한 파일은 원본을 남겨 뒀어요. 이유는 로그에서 확인하세요.` : '')
        );
        renderTable(await api.getRows($('filter').value));
        setBusy(false);
        // 일시정지로 멈췄으면 원본 확인(몇 분 걸림)을 자동으로 시작하지 않아요. 필요하면 위쪽 "원본 정리"로 (2026-11-14 실사용)
        //   마지막 몇 개를 처리하는 중에 누르면 다 끝나서 paused 가 아닐 수 있어요 → 누른 적이 있으면 똑같이 건너뛰어요
        if (r.paused || pauseClicked) {
          // "원본 정리" 버튼은 지울 수 있는 원본이 있을 때만 보여서, 그때만 안내해요
          if (r.job && r.job.deletable) setStatus($('status').textContent + '\n🧹 일시정지 중에는 원본 정리 확인을 하지 않아요. 필요하면 위쪽 "원본 정리"를 눌러 주세요');
        } else await offerTrash(r.job);
        // 원본 정리 안내가 위 글자를 덮어써도, 재생 불가 안내는 끝까지 남겨요
        if (r.broken) setStatus($('status').textContent + `\n⚠ 재생할 수 없는 영상 ${num(r.broken)}개는 백업하지 않고 원본을 남겨 뒀어요. 표의 "⚠ 재생 불가" 줄과 로그에서 확인하세요.`);
        await maybeFinish();
      } catch (e) {
        setStatus('❌ ' + cleanErr(e));
      } finally {
        setBusy(false);
      }
    }

    $('pauseBtn').onclick = async () => {
      pauseClicked = true;
      await api.pause();
      $('pauseBtn').disabled = true;
      $('pauseBtn').textContent = '⏸ 멈추는 중... (지금 파일까지)';
    };

    // ---------- 원본 정리 (하드디스크 → 휴지통 / USB·SD·네트워크 → _정리완료원본으로 이동) ----------
    api.onTrashProgress((p) => {
      $('bar').max = p.total;
      $('bar').value = p.done;
      $('progressText').textContent = `🧹 원본 정리 중... ${num(p.done)} / ${num(p.total)}`;
    });

    // 원본 확인(지문 계산) 진행 표시
    api.onCleanCheckProgress((p) => {
      $('bar').max = p.total;
      $('bar').value = p.done;
      // final: "휴지통으로 옮기기"를 누른 뒤의 마지막 확인 (파일이 그대로인지만 봐요)
      $('progressText').textContent = p.final
        ? `🧹 옮기기 전 마지막 확인: 파일이 그대로인지만 봐요… (${num(p.done)}/${num(p.total)})`
        : `🔍 원본 확인 중… (${num(p.done)}/${num(p.total)})`;
    });

    // 회차가 끝났을 때: 원본 확인(결과 파일 다시 읽기, 오래 걸림)을 바로 하지 않고 먼저 물어봐요
    //   2026-11-15 실사용: 정리하지 않은 원본이 쌓여 회차마다 13,418개(399GB)를 다시 읽었음
    //   가져올 폴더가 복사본이면 원본 정리가 필요 없어서 "취소"로 건너뛰면 돼요
    async function offerTrash(j) {
      if (!j || !j.deletable) return;
      const ok = confirm(
        `원본 정리를 위해 백업 결과를 확인할까요?\n\n` +
        `· 지울 수 있는 원본 ${num(j.deletable)}개 (${fmtBytes(j.deletableBytes)})의 결과 파일을 확인해요. 쓸 때 기록과 같은 파일은 다시 읽지 않아서 보통 몇 분이에요 (옛 작업 기록은 오래 걸려요)\n` +
        `· 원본을 지우지 않을 거면 "취소" (가져올 폴더가 복사본일 때 등)\n` +
        `· 나중에 위쪽 "원본 정리" 버튼으로 언제든 할 수 있어요`
      );
      if (ok) await askTrash();
      else setStatus($('status').textContent + '\n🧹 원본 정리 확인은 건너뛰었어요. 필요하면 위쪽 "원본 정리"를 눌러 주세요');
    }

    async function askTrash() {
      // 확인하는 동안: 예전 문구 지우기, 버튼 막기, 진행 막대 보이기 (멈춘 것처럼 보이지 않게)
      setStatus('🔍 원본 확인 중… 쓸 때 기록과 같은 결과 파일은 다시 읽지 않고, 일부(표본)만 끝까지 읽어 맞춰 봐요');
      setBusy(true);
      $('progressBox').style.display = 'block';
      $('bar').value = 0;
      $('progressText').textContent = '🔍 원본 확인 중…';
      let info;
      try {
        info = await api.trashInfo();
      } finally {
        setBusy(false);
      }
      // 확인하다 재생 불가 영상을 찾았으면 배너와 표에 바로 보여줘요
      const brokenBefore = job ? job.stats.broken : 0;
      setJob(info.job);
      // 규칙에 걸려 남긴 원본이 있으면 목록 메모에 까닭이 생겨요 → 표도 새로 그려요 (개선 12)
      const skippedNow = (info.check && info.check.skipped) || 0;
      const skipText = skippedNow ? `\n🧹 백업 파일과 정보가 달라 원본 ${num(skippedNow)}개는 남겼어요. 까닭은 목록 메모에 있어요 (다음부터 "지울 수 있는 원본" 에서 빠져요)` : '';
      if ((info.job && info.job.stats.broken !== brokenBefore) || skippedNow) renderTable(await api.getRows($('filter').value));
      if (!info.count) {
        setStatus('정리할 원본이 없어요 (결과 파일이 확인된 원본만 정리해요)' + skipText);
        return;
      }
      // 확인 요약: 기록을 믿은 결과 파일 수와 표본 검사 결과
      const c = info.check;
      const weakText = c && c.weak ? ' (exFAT 처럼 변경 시각을 기록하지 않는 디스크라 표본을 늘렸어요)' : '';
      const checkText = c && c.trusted ? ` (쓸 때 기록과 같은 결과 파일 ${num(c.trusted)}개 중 표본 ${num(c.sampled)}개를 끝까지 읽어 확인${weakText}${c.sampleFail ? `, 다른 파일 ${num(c.sampleFail)}개 → 전부 다시 확인함` : ', 모두 같음'})` : '';
      setStatus(`🔍 원본 확인 끝: 정리할 수 있는 원본 ${num(info.count)}개${checkText}${skipText}`);
      // 휴지통에 다 담기지 않는 드라이브 (2026-11-15 사용자 결정: 경고 한 줄 대신 고르게)
      //   휴지통 크기를 넘으면 Windows 가 먼저 넣은 것부터 비워서, 휴지통으로 보내도 대부분은 되살릴 수 없어요
      const over = info.drives.filter((d) => d.method === 'trash' && d.overflow);
      const capText = (d) => (d.capBytes ? `약 ${fmtBytes(d.capBytes)}` : '일부');
      const where = info.drives
        .map((d) => {
          const how = d.method !== 'trash' ? '가져올 폴더\\_정리완료원본 으로 이동' : d.overflow ? '휴지통에 다 안 들어가요 (아래에서 골라요)' : '휴지통으로';
          return `${d.root} (${d.label}) ${num(d.count)}개 (${fmtBytes(d.bytes)}) → ${how}`;
        })
        .join('\n');
      let msg =
        `백업 폴더에 저장이 끝난 원본 ${num(info.count)}개 (${fmtBytes(info.bytes)})를 정리할까요?\n\n${where}\n\n` +
        `- 결과 파일이 백업 폴더에 있는 것만 정리해요\n- 실패한 파일, 재생할 수 없는 영상, 확인이 필요한 중복은 남겨 둬요\n- 영구 삭제는 하지 않아요`;
      if (over.length) {
        msg +=
          `\n\n휴지통이 모자란 드라이브(${over.map((d) => d.root).join(', ')})는 둘 중에서 골라요\n` +
          `- _정리완료원본으로 옮기기: 바로 끝나고 언제든 되돌릴 수 있어요. 디스크 공간은 아직 안 생겨요 (나중에 그 폴더를 직접 지우면 생겨요)\n` +
          `- 휴지통으로 옮기기: 공간이 생기지만 휴지통에 남는 건 마지막에 넣은 ${over.map(capText).join(', ')}뿐이에요. 나머지는 Windows 가 자동으로 비워서 되살릴 수 없어요`;
      }
      if (info.warnings.length) msg += '\n\n⚠️ ' + info.warnings.join('\n⚠️ ');
      const binText = over.length ? `휴지통으로 옮기기 (${over.map(capText).join(', ')}만 되살릴 수 있음)` : '';
      const choice = await confirmClean(msg, cleanGoText(info), info.sample, binText);
      if (!choice) return;

      const before = $('status').textContent; // 이번 회차 결과는 남겨 두기
      setBusy(true);
      $('progressBox').style.display = 'block';
      // "확인 끝" 문구가 남아 다시 확인하는 것처럼 보이지 않게 (2026-11-15 실사용)
      setStatus('🧹 원본 정리 중… 먼저 확인한 파일이 그대로인지만 보고 바로 옮겨요');
      $('bar').value = 0;
      $('progressText').textContent = '🧹 옮기기 전 마지막 확인…';
      try {
        const r = await api.trashOriginals({ binOverflow: choice === 'bin' ? 'trash' : 'move' });
        setJob(r.job);
        setStatus(
          before +
            `\n🧹 원본 정리: 휴지통 ${num(r.trashed)}개, _정리완료원본으로 이동 ${num(r.moved)}개` +
            (r.fail ? ` (실패 ${num(r.fail)}개 — 로그 확인)` : '')
        );
      } finally {
        setBusy(false);
      }
    }
    // 확인 창: 기본 버튼 → 'go', "휴지통으로 옮기기"(넘칠 때만 보임) → 'bin', 나중에 정리하기나 Esc → false
    //   🔍 샘플 확인으로 백업 폴더에 남을 결과 파일을 직접 열어 보고 정할 수 있어요
    //   binText: 휴지통이 넘칠 때 "그래도 휴지통" 버튼 글자 (없으면 버튼 숨김)
    //   돌려주는 값: 'go' (기본 버튼) / 'bin' (그래도 휴지통) / false (나중에)
    function confirmClean(msg, goText, sample, binText = '') {
      return new Promise((resolve) => {
        const d = $('cleanDialog');
        $('cdMsg').textContent = msg;
        $('cdGo').textContent = goText;
        $('cdGoBin').hidden = !binText;
        $('cdGoBin').textContent = binText;
        renderSample(sample);
        const done = (ok) => {
          d.oncancel = null;
          d.close();
          resolve(ok);
        };
        $('cdGo').onclick = () => done('go');
        $('cdGoBin').onclick = () => done('bin');
        $('cdLater').onclick = () => done(false);
        d.oncancel = (e) => {
          e.preventDefault();
          done(false);
        };
        d.showModal();
        $('cdLater').focus(); // Enter를 잘못 눌러도 정리되지 않게
      });
    }

    // 버튼 문구는 결과를 말해요 (모두 휴지통 / 모두 옮기기 / 섞임)
    function cleanGoText(info) {
      // 휴지통에 다 담기지 않는 드라이브는 기본이 _정리완료원본으로 옮기기예요 (되돌리기 쉬운 쪽)
      const methods = new Set(info.drives.map((d) => (d.method === 'trash' && d.overflow ? 'move' : d.method)));
      const n = num(info.count);
      if (methods.size === 1 && methods.has('trash')) return `원본 ${n}개 휴지통으로 옮기기`;
      if (methods.size === 1 && methods.has('move')) return `원본 ${n}개 _정리완료원본으로 옮기기`;
      return `원본 ${n}개 정리하기`;
    }

    // 🔍 샘플 목록 그리기 (종류, 이름, 백업 폴더 안의 위치). 누르면 Windows 기본 프로그램으로 크게 열어요
    //   sample = { items: 뽑은 목록, total: 후보 전체 수 }
    function renderSample(sample) {
      const list = (sample && sample.items) || [];
      const total = (sample && sample.total) || list.length;
      const ul = $('cdSample');
      ul.textContent = '';
      $('cdSampleErr').textContent = '';
      for (const s of list) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'cd-item';
        b.title = '크게 열기';
        for (const [cls, text] of [['cd-kind', s.kind], ['cd-name', s.name], ['cd-folder', s.folder]]) {
          const span = document.createElement('span');
          span.className = cls;
          span.textContent = text;
          b.appendChild(span);
        }
        b.onclick = async () => {
          $('cdSampleErr').textContent = '';
          try {
            await api.openCleanSample(s.key);
          } catch (e) {
            $('cdSampleErr').textContent = '⚠ ' + cleanErr(e);
          }
        };
        const li = document.createElement('li');
        li.appendChild(b);
        ul.appendChild(li);
      }
      const more = total > list.length; // 보여 준 것보다 후보가 많을 때만 다시 뽑을 뜻이 있어요
      $('cdSampleInfo').textContent = more
        ? `백업 폴더에 남을 결과 파일 ${num(total)}개 중 무작위 ${list.length}개예요 (종류별로 골고루). 누르면 크게 열려요`
        : `백업 폴더에 남을 결과 파일 ${list.length}개를 모두 보여 줘요. 누르면 크게 열려요`;
      $('cdResample').disabled = !more; // 후보가 10개 이하면 다시 뽑아도 같은 파일이에요
    }
    $('cdResample').onclick = async () => {
      try {
        renderSample(await api.cleanSample());
      } catch (e) {
        $('cdSampleErr').textContent = '⚠ ' + cleanErr(e);
      }
    };

    $('trashBtn').onclick = async () => {
      try {
        await askTrash();
        await maybeFinish();
      } catch (e) {
        setStatus('❌ ' + cleanErr(e)); // 오류가 나도 조용히 끝나지 않게 화면에 보여줘요
      }
    };

    // 다 끝났으면 작업 정리
    async function maybeFinish() {
      if (job && job.stats.todo === 0 && job.deletable === 0) {
        const last = job.stats; // 작업을 닫으면 숫자가 사라져서 먼저 잡아 둬요
        await api.closeJob('done');
        setJob(null);
        renderJobChips(last, 'done');
        setStatus($('status').textContent + '\n✅ 모든 작업이 끝났어요!');
      }
    }

    $('finishBtn').onclick = async () => {
      // 아직 세는 중(null)이면 남은 원본이 있을 수 있어서 똑같이 물어봐요
      if (job.deletable !== 0 && !confirm(job.deletable == null ? '지우지 않은 원본이 있을 수 있어요 (아직 세는 중). 원본은 그대로 두고 작업을 끝낼까요?' : '지우지 않은 원본이 있어요. 원본은 그대로 두고 작업을 끝낼까요?')) return;
      const last = job.stats;
      await api.closeJob('done');
      setJob(null);
      renderJobChips(last, 'finish');
      setStatus('✅ 작업을 끝냈어요');
    };
    $('cancelBtn').onclick = async () => {
      if (!confirm('남은 작업을 취소할까요?\n(이미 완료된 파일과 원본은 그대로 있어요)')) return;
      const last = job.stats;
      await api.closeJob('cancel');
      setJob(null);
      renderJobChips(last, 'cancel');
      setStatus('✖ 작업을 취소했어요');
    };

    // ---------- 기타 버튼 ----------
    // 갤러리 화면으로 (작업 중이면 main이 거절하고 이유를 알려 줘요)
    $('galleryBtn').onclick = async () => {
      try {
        await api.gallery.openScreen('gallery');
      } catch (e) {
        setStatus('⚠ ' + cleanErr(e));
      }
    };
    $('logBtn').onclick = () => api.openLogs();
    $('openBtn').onclick = async () => {
      if (!(await api.openFolder(state.backupRoot))) alert('백업 폴더를 먼저 골라 주세요');
    };

    function cleanErr(e) {
      return String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
    }

    // ---------- 시작 ----------
    (async () => {
      const s = await api.getState();
      Object.assign(state, {
        source: s.settings.source,
        backupRoot: s.settings.backupRoot,
        includeSub: s.settings.includeSub,
        batchSize: s.settings.batchSize,
      });
      $('includeSub').checked = state.includeSub;
      $('batchSize').value = state.batchSize;
      renderPaths();
      renderTools(s.tools);
      setJob(s.job);
      if (s.job) {
        setStatus('📌 이전 작업을 불러왔어요. 위쪽 버튼으로 이어서 할 수 있어요.');
        renderTable(await api.getRows('all'));
      }
    })();
  </script>
</body>
</html>
